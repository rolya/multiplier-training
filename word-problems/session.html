<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Задачи на умножение и деление — тренировка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <!-- ===== Экран тренировки ===== -->
    <section id="screen-quiz">
      <div class="topbar">
        <div class="progress"><div class="progress__bar" id="progress-bar"></div></div>
        <div class="counter" id="counter">—</div>
      </div>

      <div class="card">
        <p class="problem" id="problem">…</p>

        <div id="scene"></div>

        <form class="answer-row" id="answer-form" autocomplete="off">
          <label class="answer-row__label" for="answer-input">Ответ:</label>
          <input class="answer-input" id="answer-input" type="text" inputmode="numeric"
                 pattern="[0-9]*" maxlength="3" aria-label="Ответ числом">
          <button type="submit" class="btn btn--check" id="check-btn">Проверить ✔️</button>
        </form>
        <p class="answer-line" id="answer-line" hidden></p>

        <div class="feedback" id="feedback"></div>

        <div class="help-row">
          <button type="button" class="btn btn--help" id="help-btn">🆘 Помочь</button>
        </div>
        <div class="help" id="help" hidden></div>

        <div class="next-row">
          <button type="button" class="btn btn--next" id="next-btn" hidden>Далее ➡️</button>
        </div>
      </div>

      <div class="btn-row">
        <a class="btn btn--ghost" href="index.html">⚙️ Выйти в настройки</a>
        <a class="btn btn--ghost" href="../index.html">🏠 Домой</a>
      </div>
    </section>

    <!-- ===== Экран итогов ===== -->
    <section id="screen-result" hidden>
      <h1>🎉 Тренировка закончена!</h1>

      <div class="card card--center">
        <div class="score-emoji" id="result-emoji">🌟</div>
        <div class="score" id="result-score">0<span class="score__of"> / 0</span></div>
        <p class="score-text" id="result-text"></p>
        <div class="btn-row">
          <button type="button" class="btn btn--start" id="again-btn">🔁 Начать заново</button>
          <a class="btn btn--violet" href="mistakes.html" target="_blank" rel="noopener">🖨️ Мои ошибки</a>
        </div>
        <div class="btn-row" style="margin-top:16px">
          <a class="btn btn--ghost" href="../index.html">🏠 Домой</a>
        </div>
      </div>

      <div class="card">
        <h2>📚 Все задачи с ответами</h2>
        <p class="setting__hint">
          Зелёные — решил сразу, оранжевые — с подсказкой «Помочь», красные — с ошибками.
        </p>
        <ol class="result-list" id="result-list"></ol>
      </div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/problems-data.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/session-page.js"></script>
</body>
</html>
