<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таблица умножения — тренировка</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <!-- ===== Экран тренировки ===== -->
    <section id="screen-quiz">
      <div class="topbar">
        <div class="progress"><div class="progress__bar" id="progress-bar"></div></div>
        <div class="counter" id="counter">—</div>
      </div>

      <div class="card">
        <div class="question" id="question">…</div>

        <div class="options" id="options" hidden></div>

        <div class="answer-box" id="answer-box" hidden>
          <input class="answer-input" id="answer-input" type="number" inputmode="numeric"
                 autocomplete="off" min="0" placeholder="?">
          <button type="button" class="btn" id="check-btn">Проверить</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="next-row">
          <button type="button" class="btn btn--next" id="next-btn" hidden>Далее ➡️</button>
        </div>
      </div>

      <div class="btn-row">
        <a class="btn btn--ghost" href="index.html">⚙️ Выйти в настройки</a>
      </div>
    </section>

    <!-- ===== Экран итогов ===== -->
    <section id="screen-result" hidden>
      <h1>🎉 Тренировка закончена!</h1>

      <div class="card card--center">
        <div class="score-emoji" id="result-emoji">🌟</div>
        <div class="score" id="result-score">0<span class="score__of"> / 0</span></div>
        <p class="score-text" id="result-text"></p>
        <div class="btn-row">
          <button type="button" class="btn btn--start" id="again-btn">🔁 Начать заново</button>
          <a class="btn btn--violet" href="mistakes.html" target="_blank" rel="noopener">🖨️ Мои ошибки</a>
        </div>
      </div>

      <div class="card">
        <h2>📚 Все примеры с правильными ответами</h2>
        <p class="setting__hint">Прочитай их вслух — так они лучше запомнятся.</p>
        <div class="examples-grid" id="result-grid"></div>
      </div>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/matrix.js"></script>
  <script src="js/session-page.js"></script>
</body>
</html>
